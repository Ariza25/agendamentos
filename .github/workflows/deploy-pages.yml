name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build All Frontends (Landing + Admin + Booking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            landing/package-lock.json
            admin/package-lock.json
            booking/package-lock.json

      - name: Install & Build Landing
        working-directory: landing
        run: |
          npm ci || npm install
          npm run build

      - name: Install & Build Admin
        working-directory: admin
        env:
          VITE_BACKEND_ORIGIN: ${{ vars.VITE_BACKEND_ORIGIN || secrets.VITE_BACKEND_ORIGIN }}
        run: |
          npm ci || npm install
          npm run build

      - name: Install & Build Booking
        working-directory: booking
        env:
          VITE_BACKEND_ORIGIN: ${{ vars.VITE_BACKEND_ORIGIN || secrets.VITE_BACKEND_ORIGIN }}
        run: |
          npm ci || npm install
          npm run build

      - name: Assemble GitHub Pages Directory
        run: |
          mkdir -p _site
          # 1. Landing na raiz
          cp -r landing/dist/* _site/
          # 2. Admin em /admin
          mkdir -p _site/admin
          cp -r admin/dist/* _site/admin/
          # 3. Booking em /booking
          mkdir -p _site/booking
          cp -r booking/dist/* _site/booking/
          # 4. Desabilitar processamento Jekyll
          touch _site/.nojekyll

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

